{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Inventario</title>
    <link rel="stylesheet" href="{% static 'inventario/estilos.css' %}">
</head>

<body>
    <header>
        <h1>Sistema de Inventario</h1>
        <nav>
            <a href="{% url 'listar_productos' %}">Inicio</a>
            {% if user.is_authenticated %}
            <a href="{% url 'crear_producto' %}">
            Nuevo producto
            </a>
            <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Cerrar sesión</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}">
            Iniciar sesión
            </a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block contenido %}
        {% endblock %}
    </main>
</body>
</html>
