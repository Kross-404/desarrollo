
{% extends 'inventario/base.html' %}

{% block contenido %}

<h2>Iniciar sesión</h2>

{% if form.errors %}
    <p class="errorlist">
        Usuario o contraseña incorrectos.
    </p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Ingresar
    </button>
</form>

{% endblock %}
