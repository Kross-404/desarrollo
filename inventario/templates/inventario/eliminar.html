{% extends 'inventario/base.html' %}

{% block contenido %}

<h2>Eliminar producto</h2>

<p>
    ¿Estás seguro de que deseas eliminar
    el producto "{{ producto.nombre }}"?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">
        Sí, eliminar
    </button>
</form>

<a href="{% url 'listar_productos' %}">
    Cancelar
</a>

{% endblock %}
